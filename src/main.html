/* where to look after a find: small countries are centred, but a big one that is already (partly) on screen stays put,

  walk(feat.geometry.coordinates);return best;

/* big multi-part countries (Canada, Indonesia, Russia...) only project the parts that can be seen */
function makeParts(g){

    const ft={type:"Feature",geometry:{type:"Polygon",coordinates:poly}},c=d3.geoCentroid(ft),b=d3.geoBounds(ft);let r=Math.PI;

  for(let c=0;c<2;c++){const d=b.getChannelData(c);let p=0;
    for(let i=0;i<len;i++){const x=(Math.random()*2-1)*Math.pow(1-i/len,2.6);p=p*.55+x*.45;d[i]=p}}

function AC(kind){                                   // kind: "mus" for music/drone, otherwise sound effects

    if(!actx){
      actx=new (window.AudioContext||window.webkitAudioContext)();
      master=actx.createGain();master.gain.value=.9*S.vol;
      const comp=actx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.25;

        const k=Math.min(1,(performance.now()-t3s)/MOT);
        b.ov.style("fill-opacity",easeOut(k));tick();
        if(k>=1){t3.stop();moDone=true;maybeFinish()}
      });
    }
    function maybeFinish(){
      if(!(bloomDone&&moDone))return;
      blooms.splice(blooms.indexOf(b),1);done();
      clone.remove();b.ov.remove();document.getElementById("m-"+uid)?.remove();document.getElementById("f-"+uid)?.remove();
      setBusy();if(v===MV&&!animating)render();

    }
  }
}function placeBloom(b){
  const v=b.v,p=v.projection(b.ll),bb=v.path.bounds(b.src),d=v.path(b.src);
  b.clone.attr("d",d);if(b.ov)b.ov.attr("d",d);
  const m=document.getElementById("m-"+b.uid);if(!m)return;
  m.setAttribute("width",v.W);m.setAttribute("height",v.H);
  if(!isFinite(bb[0][0])||!p){b.lobes.forEach(l=>l.el.setAttribute("r",0));return}
  const Rr=Math.max(Math.hypot(bb[0][0]-p[0],bb[0][1]-p[1]),Math.hypot(bb[1][0]-p[0],bb[0][1]-p[1]),Math.hypot(bb[0][0]-p[0],bb[1][1]-p[1]),Math.hypot(bb[1][0]-p[0],bb[1][1]-p[1]),4);
  if(b.dispEl){b.dispEl.setAttribute("scale",clamp(Rr*.32,3,34));b.turbEl.setAttribute("baseFrequency",clamp(1.1/(Rr*2),.008,.16).toFixed(4))}
  b.lobes.forEach(l=>{
    const k=clamp((b.t-l.delay)/(1-l.delay),0,1);
    l.el.setAttribute("cx",p[0]+l.ox*Rr*.5);l.el.setAttribute("cy",p[1]+l.oy*Rr*.5);
    l.el.setAttribute("r",Rr*l.size*easeOut(k)+(k>0?1:0));
  });
  b.clone.style("fill-opacity",.97-(.97-b.fin)*easeOut(clamp(b.t*1.1,0,1)));
}
function rings(ll,col,fast,v){
  if(reduced)return;v=v||MV;
  (fast?[0]:[0,230]).forEach((delay,j)=>{
    const c=v.gFx.append("circle").attr("class","pulse").attr("stroke",col);
    const t0=performance.now(),L=fast?900:1700-j*250;
    const t=d3.timer(()=>{
      const k=(performance.now()-t0-delay)/L;
      if(k<0){c.attr("opacity",0);return}
      if(k>1){c.remove();t.stop();return}
      const p=v.projection(ll),e=easeOut(k);
      c.attr("cx",p[0]).attr("cy",p[1]).attr("r",5+e*(46-j*12)).attr("stroke-width",2.4*(1-k)+.4).attr("opacity",.75*Math.pow(1-k,1.5));
    });
  });
}
/* a tiny gold glint, like a signature, where the capital sits */
function glint(ll,v){
  if(reduced)return;
  const g=v.gFx.append("path").attr("d","M0,-9 L2,-2 L9,0 L2,2 L0,9 L-2,2 L-9,0 L-2,-2 Z").attr("fill","#F2D27A").attr("stroke","#fff").attr("stroke-width",.6).attr("opacity",0);
  const t0=performance.now();

    const k=(performance.now()-t0)/1500;if(k>1){g.remove();t.stop();return}
    const q=v.projection(ll),s=Math.sin(k*Math.PI);
    g.attr("transform",`translate(${q[0]},${q[1]}) rotate(${k*70}) scale(${.4+s*.9})`).attr("opacity",s*.9);
  });
}

function pool(){
  let p=S.practice?weakIds():regionPool();

}
function pickTarget(){
  S.turn++;

  const due=!S.practice&&S.returnQ.find(q=>q.at<=S.turn&&p.includes(q.id));
  if(due){S.returnQ=S.returnQ.filter(q=>q!==due);return due.id}
  let cand=S.practice?p.filter(id=>!S.recent.includes(id)):p.filter(id=>!cf().has(id)&&!S.recent.includes(id));
  if(!cand.length)cand=p.filter(id=>!S.recent.includes(id));
  if(!cand.length)cand=p;
  const w=cand.map(id=>Math.pow(Math.max(FACTS[id].a,2000),.25));
  let t=Math.random()*d3.sum(w);for(let i=0;i<cand.length;i++){t-=w[i];if(t<=0)return cand[i]}
  return cand[0];
}

function guess(id,ll,other){
  if(S.done||S.mode!=="find"||S.qIdle||!S.target)return;

  const T=S.target,f=FACTS[T];

      :`That’s ${article(g.n)}. ${tn()} is about ${distTxt(d)} to the ${bearing(LL(id),LL(T))}.`);

const total=()=>playable.length;
const foundN=()=>playable.filter(f=>cf().has(f.id)).length;
function success(shown,ll){
  const T=S.target,f=FACTS[T];S.done=true;
  const before=foundN(),regBefore=playable.filter(x=>FACTS[x.id].r===f.r&&cf().has(x.id)).length,regB=(f.x?[f.r,f.x]:[f.r]).map(r=>[r,playable.filter(x=>inReg(x.id,r)&&cf().has(x.id)).length,playable.filter(x=>inReg(x.id,r)).length]);
  const first=S.tries===0&&!shown;
  if(shown){if(!SESS)S.shown.add(T);if(!D.active)S.returnQ.push({id:T,at:S.turn+4});S.weak[T]=Math.min(10,(S.weak[T]||0)+3);S.streak=0}
  else{
    if(SESS)SESS.add(T);else{S.found.add(T);S.shown.delete(T)}
    if(S.tries>=2&&!D.active)S.returnQ.push({id:T,at:S.turn+6});
    if(first){S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);if(S.weak[T])S.weak[T]=Math.max(0,S.weak[T]-1)}
    if(S.quiz==="flag"&&!D.active)S.counts.flag++;
    if(S.quiz==="silhouette"&&!D.active)S.counts.sil=(S.counts.sil||0)+1;
    if(S.quiz==="capital"&&!D.active)S.counts.capital++;
  }
  if(S.weak[T]===0)delete S.weak[T];
  if(D.active){D.marks.push(shown?"🟥":first?"🟩":S.tries<=2?"🟨":"🟧");D.idx++;if(D.idx>=D.ids.length&&D.t0!=null)D.tEnd=performance.now()-D.t0}
  updateProgress();save();
  if(shown)sndShow();
  const regTotal=playable.filter(x=>FACTS[x.id].r===f.r).length;
  const after=foundN(),regAfter=regBefore+(shown?0:1);
  const praise=["Found it.","There it is.","Lovely.","Exactly right.","Well spotted."];
  let msg=shown?`Here it is. It’ll come back around in a few turns.`:
    (first?praise[Math.floor(Math.random()*praise.length)]+" First try.":`${praise[Math.floor(Math.random()*praise.length)]} Painted in.`);
  let big=null;
  if(!shown&&!SESS){
    const th=[.25,.5,.75,1].find(x=>before/total()<x&&after/total()>=x);
    const dr=regB.find(([r,b,t])=>b+1===t);
    if(dr){big=dr[0];msg+=` That’s all of ${dr[0]==="Americas"?"the Americas":dr[0]} painted.`}
    else if(th){big=f.r;msg+=th===1?" The whole world is painted.":` A ${th===.25?"quarter":th===.5?"half":"three quarters"} of the world is painted.`}
  }
  swell($("hint"),msg);
  if(quizOf()!=="country"){$("ask").textContent="That’s";swell($("target"),f.n);$("target").classList.remove("small")}
  $("showBtn").hidden=true;$("nextBtn").hidden=false;
  $("nextBtn").textContent=D.active&&D.idx>=D.ids.length?"See results":"Next place";
  if(shown&&lensOf(T)&&!(lensOpen&&lensG.ids.includes(T)))openLens(lensOf(T));
  const inLens=lensOpen&&lensG.ids.includes(T);
  let fp=null;
  if(inLens)floatLabel(f.n,LL(T),3200,LV);
  else{
    fp=focusFor(T,ll);
    if(fp.fly)flyTo(fp.fly,1300,Math.min(5,Math.max(zoomK,f.a<30000?2.6:f.a<350000?1.7:1))).then(()=>{floatLabel(f.n,fp.fly,3200)});
    else floatLabel(f.n,fp.pt,3200);
  }
  startReveal(T,ll||(fp&&fp.pt)||LL(T),shown,()=>paint(),false,inLens?LV:MV,()=>{if(!shown){sndHit(f.r,first);if(big)setTimeout(()=>sndFlourish(big),700)}});
  if(inLens)lensCaption(T);else showCard(T);
  setTimeout(checkAch,1800);
  setTimeout(()=>$("nextBtn").focus({preventScroll:true}),50);
}

const introEl=$("intro"),introTimers=[];

const INTRO_REGIONS=[["Africa",["818","566","710","404","012"]],["Europe",["250","276","380","724","826"]],["Asia",["156","356","392","682","398"]],["Americas",["840","076","124","032","484"]],["Oceania",["036","554","598"]]];
function initIntro(){
  const skip=/[?&]nointro/.test(location.search)||(()=>{try{return localStorage.getItem("mb-skip-intro")==="1"}catch(e){return false}})();
  if(skip){introEl.remove();document.body.classList.remove("introing");introState="done";return}
  introState="wait";
  if(S.found.size){introOwn=new Set();paint()}   // a returning player’s map stays hidden until the opening reveals it
  if(S.found.size){   // build their paintings while the splash waits, a couple at a time, so the opening never has to do it all at once
    const order=["Africa","Europe","Asia","Americas","Oceania"],ids=[...S.found].filter(id=>FACTS[id]).sort((a,b)=>order.indexOf(FACTS[a].r)-order.indexOf(FACTS[b].r));let wi=0;
    const step=()=>{const t0=performance.now();while(wi<ids.length&&performance.now()-t0<9)ensureArt(ids[wi++]);if(wi<ids.length)setTimeout(step,24)};
    setTimeout(step,200);
  }else INTRO_REGIONS.forEach(([r,a],i)=>a.slice(0,3).forEach((id,j)=>{if(FACTS[id])setTimeout(()=>warmArt(id),300+(i*3+j)*140)}));
  const ready=()=>{if(introState!=="wait")return;introState="ready";$("introBegin").hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>{$("introBegin").classList.add("on");$("introHint").classList.add("on")}));try{$("introBegin").focus({preventScroll:true})}catch(e){}};
  (document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1800))]):Promise.resolve()).then(ready);

  $("introBegin").onclick=start;
  $("introSkip").onclick=()=>introHandoff(true);

    if(["Shift","Control","Alt","Meta","CapsLock","Tab"].includes(e.key))return;

function introPlay(){

  $("introBegin").classList.add("gone");$("introHint").classList.remove("on");$("introSkip").hidden=false;

  setTimeout(()=>requestAnimationFrame(tick),2500);
}
/* ---------- text selection: only reading text can be selected, and a stray selection is cleared ---------- */
const SEL_OK=".learn,.card .note,.card dd,.card dt,.sheet,.share,.attrib,input,textarea,select,.dvPanel";
const inSelOk=n=>{const t=n&&(n.nodeType===1?n:n.parentElement);return !!(t&&t.closest&&t.closest(SEL_OK))};
function clearSel(){try{const sel=getSelection();if(sel&&sel.rangeCount&&!sel.isCollapsed&&!inSelOk(sel.anchorNode))sel.removeAllRanges()}catch(e){}}
document.addEventListener("selectstart",e=>{if(!inSelOk(e.target))e.preventDefault()});
document.addEventListener("pointerdown",e=>{if(!inSelOk(e.target))clearSel()},true);
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==="a"&&!inSelOk(e.target)&&!inSelOk(document.activeElement)){e.preventDefault();clearSel()}},true);
document.addEventListener("visibilitychange",clearSel);window.addEventListener("pageshow",clearSel);clearSel();

/* ======================================================================
   SILHOUETTE QUIZ: the globe is hidden, a shape is shown, the answer is typed
   ====================================================================== */
const SIL_ALIAS=[["United States","United States of America","USA","US","America"],["United Kingdom","UK","Britain","Great Britain","England"],["Ivory Coast","Cote d’Ivoire","Cote dIvoire"],["Czechia","Czech Republic"],["Myanmar","Burma"],["Eswatini","Swaziland"],["Cabo Verde","Cape Verde"],["Vatican City","Vatican","Holy See"],["DR Congo","Democratic Republic of the Congo","Congo Kinshasa","DRC"],["Republic of the Congo","Congo Brazzaville","Republic of Congo","Congo"],["Timor-Leste","East Timor"],["North Macedonia","Macedonia"],["T\u00FCrkiye","Turkey","Turkiye"],["Palestine","State of Palestine"],["Russia","Russian Federation"],["South Korea","Republic of Korea"],["North Korea","DPRK"],["Laos","Lao PDR"],["Vietnam","Viet Nam"],["Micronesia","Federated States of Micronesia"],["Bahamas","The Bahamas"],["Gambia","The Gambia"],["Brunei","Brunei Darussalam"],["Syria","Syrian Arab Republic"],["Iran","Persia"],["Tanzania","United Republic of Tanzania"],["Moldova","Republic of Moldova"],["Bolivia","Plurinational State of Bolivia"],["Venezuela","Bolivarian Republic of Venezuela"],["S\u00E3o Tom\u00E9 and Pr\u00EDncipe","Sao Tome and Principe","Sao Tome"],["Saint Kitts and Nevis","St Kitts and Nevis","St Kitts"],["Saint Lucia","St Lucia"],["Saint Vincent and the Grenadines","St Vincent and the Grenadines","St Vincent"],["United Arab Emirates","UAE","Emirates"],["Netherlands","Holland"],["Guinea-Bissau","Guinea Bissau"],["Trinidad and Tobago","Trinidad"],["Bosnia and Herzegovina","Bosnia"],["Antigua and Barbuda","Antigua"],["Papua New Guinea","PNG"],["Central African Republic","CAR"],["Marshall Islands","Marshalls"],["Solomon Islands","Solomons"]];
let silOn=false,silMiss=0,silNames=null;
const silNorm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/\bst\.?\s/g,"saint ").replace(/[^a-z0-9]+/g," ").trim().replace(/^the /,"");
function silBuild(){
  if(silNames)return;silNames={all:new Set(),byId:{}};
  const groups=SIL_ALIAS.map(g=>g.map(silNorm));
  Object.keys(FACTS).forEach(id=>{const n=silNorm(FACTS[id].n),set=new Set([n]);groups.forEach(g=>{if(g.includes(n))g.forEach(x=>set.add(x))});silNames.byId[id]=set;set.forEach(x=>silNames.all.add(x))});
}
function lev(a,b){const m=a.length,n=b.length;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function silCheck(id,txt){
  const t=silNorm(txt);if(!t)return false;silBuild();
  const set=silNames.byId[id];if(set.has(t))return true;
  if(silNames.all.has(t))return false;                     // a real, different country: never forgiven as a typo
  for(const n of set)if(n.length>=6&&Math.abs(n.length-t.length)<=1&&lev(t,n)<=1)return true;
  return false;
}
function silShape(id){
  const f=byId[id];if(f._sil)return f._sil;
  if(f.geometry.type!=="MultiPolygon")return (f._sil=f);
  const ps=f.geometry.coordinates.map(co=>{const g={type:"Polygon",coordinates:co};return {co,a:d3.geoArea(g),c:d3.geoCentroid(g)}}).sort((a,b)=>b.a-a.a),m=ps[0];
  const keep=ps.filter(p=>p===m||d3.geoDistance(p.c,m.c)<.5);   // the mainland and its neighbours, not far-flung territories
  return (f._sil={type:"Feature",geometry:{type:"MultiPolygon",coordinates:keep.map(p=>p.co)}});
}
function silDraw(id){
  const feat=silShape(id),w=360,h=230,c=d3.geoCentroid(feat);
  const proj=d3.geoAzimuthalEqualArea().rotate([-c[0],-c[1]]).fitExtent([[18,14],[w-18,h-14]],feat);
  const sv=d3.select("#silSvg");sv.selectAll("*").remove();
  sv.append("path").attr("d",d3.geoPath(proj)(feat));
}
function silHide(){silOn=false;const e=$("sil");if(e){e.hidden=true;e.classList.remove("out")}$("app").classList.remove("silmode")}
function silBegin(){
  const id=S.target;silOn=true;silMiss=0;
  hideCard();
  $("app").classList.add("silmode");$("sil").hidden=false;$("sil").classList.remove("out");
  silDraw(id);
  $("silIn").value="";$("silSug").innerHTML="";$("silHint").textContent=D.active?`Daily ${D.idx+1} of ${D.ids.length}`:"";
  setTimeout(()=>{try{$("silIn").focus({preventScroll:true})}catch(e){}},80);
}
function silFinish(shown){
  if(!silOn)return;silOn=false;
  $("sil").classList.add("out");$("app").classList.remove("silmode");
  setTimeout(()=>{$("sil").hidden=true;$("sil").classList.remove("out")},520);
  success(shown);
}
function silGuess(){
  if(!silOn)return;
  const txt=$("silIn").value;if(!txt.trim())return;
  const T=S.target,f=FACTS[T];
  if(silCheck(T,txt))return silFinish(false);
  silMiss++;S.tries++;S.streak=0;S.weak[T]=Math.min(10,(S.weak[T]||0)+2);save();sndMiss();
  const fm=$("silForm");fm.classList.remove("shake");void fm.offsetWidth;fm.classList.add("shake");
  const hints=[`Not quite. It is in ${regName(f)}.`,`It starts with ${f.n[0].toUpperCase()}.`,`Its name has ${f.n.replace(/[^\p{L}]/gu,"").length} letters.`];
  $("silHint").textContent=S.hints?hints.slice(0,Math.min(3,silMiss)).join(" ")+(silMiss>=3?" You can also ask to be shown.":""):"Not quite.";
  $("silIn").select();
}
$("silForm").onsubmit=e=>{e.preventDefault();silGuess()};
$("silShow").onclick=()=>silFinish(true);
$("silSkip").onclick=()=>{if(!silOn)return;sndTick();nextRound()};
$("silIn").addEventListener("input",()=>{
  const t=silNorm($("silIn").value),ul=$("silSug");ul.innerHTML="";
  if(t.length<2)return;
  const m=Object.keys(FACTS).filter(id=>silNorm(FACTS[id].n).includes(t)).sort((a,b)=>silNorm(FACTS[a].n).startsWith(t)===silNorm(FACTS[b].n).startsWith(t)?0:silNorm(FACTS[a].n).startsWith(t)?-1:1).slice(0,5);
  m.forEach(id=>ul.append(el("li",{},el("button",{type:"button",onclick:()=>{$("silIn").value=FACTS[id].n;ul.innerHTML="";$("silIn").focus()}},FACTS[id].n))));
});

/* ---------- camera memory: where you last left the globe ---------- */
let viewTm=null;
function saveViewSoon(){clearTimeout(viewTm);viewTm=setTimeout(save,400)}
function restoreView(){
  const v=S.view;if(!v||!Array.isArray(v.r))return;
  projection.rotate([+v.r[0]||0,clamp(+v.r[1]||0,-85,85),+v.r[2]||0]);
  zoomK=clamp(+v.k||1,.8,8);
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});window.addEventListener("pagehide",save);

/* ---------- go ---------- */
window.addEventListener("resize",size);
document.documentElement.dataset.mode="wander";document.getElementById("app").classList.add("wander");
try{if(localStorage.getItem("mb-dock"))$("dock").classList.remove("shimmer")}catch(e){}
syncUnit();restoreView();size();paint();updateProgress();placeDock();document.fonts&&document.fonts.ready&&document.fonts.ready.then(placeDock);window.addEventListener("resize",placeDock);
setTimeout(buildMid,700);
initIntro();
syncZoom();
if(!reduced){drifting=false;scheduleDrift();}
})();
