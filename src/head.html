*,*::before,*::after{box-sizing:inherit}
/* nothing but reading text is selectable, so a stray drag or Ctrl+A can never wash the whole page in highlight */
html,body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.learn,.learn *,.card .note,.card dd,.card dt,.sheet p,.sheet .kv,.sheet .tbl,.share,.attrib,.attrib *,input,textarea,select,.dvPanel,.dvPanel *{-webkit-user-select:text;user-select:text}
button,.btn,.chip,.icon-btn{-webkit-user-select:none;user-select:none}
::selection{background:color-mix(in srgb,var(--c-Europe-d) 38%,transparent);color:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--paper) var(--paper-img,none);background-size:128px 128px;
  color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
/* the night-race backdrop fades in over the paper (gradients can't be transitioned directly) */
.speedbg{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(110% 80% at 50% 40%,#10224A,#050A19 70%)}
[data-mode="speed"] .speedbg{opacity:1}

/* paper: one static tile (made once by makePaperBg) on the body: no blend layers, no masks, never repainted while the globe moves */

#toast.click{cursor:pointer;pointer-events:auto}

/* cursors: a quiet ring by default, grab for turning the globe, a crosshair ring over a place */
body,.app{cursor:var(--cur-dot)}
button,.btn,.icon-btn,.chip,.nchips button,.sw,.sw input,input[type=range],.unit{cursor:var(--cur-ring) !important}
#globe{cursor:grab}
#globe .country,#globe .beacon,#globe .beaconhit{cursor:var(--cur-cross)}
#globe .country.nopl{cursor:grab}
#globe:active,#globe:active .country,#globe:active .beacon,#globe:active .beaconhit{cursor:grabbing}
.wander .country{cursor:var(--cur-cross)}

/* readable prompt text over the map */
.prompt{--tsh:0 0 1px var(--halo),0 0 5px var(--halo),0 0 14px var(--halo),0 0 28px var(--halo-soft)}
.prompt .target,.prompt .ask,.prompt .hint,.sp-count,.sp-pen{text-shadow:var(--tsh)}
.prompt .hint{color:var(--ink-hint)}
.sp-time{text-shadow:var(--tsh),0 0 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.label{background:var(--sheet);box-shadow:0 6px 16px -8px var(--paper-shadow)}
.country.nopl{fill:color-mix(in srgb,var(--land) 84%,var(--sea-in))}

/* island-group badges (round, with a tiny map of the islands) and tiny-country beacons on the globe */
.reef .rf{fill:none;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.reef .h1{stroke:#7fd6cf;stroke-opacity:.07;stroke-width:15px}
.reef .h2{stroke:#7fd6cf;stroke-opacity:.1;stroke-width:8px}
.reef .h3{stroke:#b8f0e8;stroke-opacity:.2;stroke-width:3px}
.reef .lg{fill:#7fe0d6;fill-opacity:.38;stroke:none}
.reef .sand{stroke:#efe2bd;stroke-opacity:.75;stroke-width:2px}
body.introing .reef{opacity:0}
::view-transition-old(root),::view-transition-new(root){mix-blend-mode:normal;animation-duration:.5s;animation-timing-function:ease-in-out}   /* a plain cross fade between the old and new screens */
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
.themewash{position:fixed;inset:0;z-index:70;pointer-events:none}
.tw-fill{position:absolute;inset:0;overflow:hidden;clip-path:polygon(0 0,0 0,0 0)}
.tw-star{position:absolute;border-radius:50%;background:#e9eeff;opacity:0;animation:twStar .9s ease-out forwards}
@keyframes twStar{0%{opacity:0;transform:scale(.3)}60%{opacity:.95}100%{opacity:.55;transform:scale(1)}}
.tw-ray{position:absolute;border-radius:50%;border:2px solid rgba(255,190,70,.5);transform:translate(-50%,-50%) scale(.2);opacity:0;animation:twRay .9s ease-out forwards}
@keyframes twRay{0%{opacity:.8;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.tw-icon{position:absolute;left:50%;top:44%;width:84px;height:84px;margin:-42px 0 0 -42px;opacity:0;animation:twIcon 1s .3s cubic-bezier(.2,1.5,.4,1) forwards}
.tw-icon svg{width:100%;height:100%;display:block}
@keyframes twIcon{0%{opacity:0;transform:scale(.4) rotate(-40deg)}45%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
.beacon{fill:color-mix(in srgb,var(--sheet) 16%,transparent);stroke:var(--ink);stroke-width:1.3;stroke-dasharray:2.5 2;pointer-events:none}
.beacon.found{stroke-dasharray:none}
.beaconhit{fill:transparent}

.btn.danger{background:var(--hot);color:#fff;border-color:transparent}

/* while something flies or blooms: no blur-behind (re-blurring over a moving map every frame is costly) */
/* ---- opening sequence ---- */
.intro{position:fixed;inset:0;z-index:49;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 38%,var(--paper),var(--paper-2));transition:opacity .9s ease}
.intro.out{opacity:0;pointer-events:none}
.intro-stage{position:relative;text-align:center;padding:0 24px}
.intro-word{margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(56px,13vw,132px);letter-spacing:-.02em;line-height:1.08;position:relative;display:inline-block}
body.introing{--gr:0px}   /* no thinned-grain hole over the globe while the opening shows */
.intro-word .guide{color:var(--ink);opacity:.09}
.intro-word .ink{--mr:-100px;position:absolute;inset:0;white-space:nowrap;background:linear-gradient(95deg,var(--c-Europe-d),var(--c-Americas-d) 28%,var(--c-Africa-d) 52%,var(--c-Asia-d) 76%,var(--c-Oceania-d));-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-mask-image:radial-gradient(circle at var(--dx,30%) var(--dy,55%),#000 var(--mr,0px),transparent calc(var(--mr,0px) + 80px));mask-image:radial-gradient(circle at var(--dx,30%) var(--dy,55%),#000 var(--mr,0px),transparent calc(var(--mr,0px) + 80px))}
.intro-word .ink{background:none;-webkit-mask-image:none;mask-image:none;color:transparent}
.intro-word .il{--mr:-100px;--dx:50%;--dy:55%;background:linear-gradient(115deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-mask-image:radial-gradient(circle at var(--dx) var(--dy),#000 var(--mr),transparent calc(var(--mr) + 40px));mask-image:radial-gradient(circle at var(--dx) var(--dy),#000 var(--mr),transparent calc(var(--mr) + 40px))}
.intro-sub{font:17px var(--sans);letter-spacing:.04em;color:var(--ink-soft);margin:10px 0 0;opacity:0;transition:opacity 1.2s ease}
.intro-sub.on{opacity:1}
.intro-begin{margin-top:36px;font-size:15px;padding:10px 28px;animation:none !important;opacity:0;transition:opacity .9s ease}
.intro-begin.on{opacity:1}
.intro-begin.gone{opacity:0;pointer-events:none}
.intro-begin{display:none !important}
.intro-hint{margin:26px 0 0;font:15px var(--sans);letter-spacing:.02em;color:var(--ink-faint);opacity:0;transition:opacity .9s ease .3s}
.intro-hint.on{opacity:1}
.intro{cursor:pointer}
.intro-drop{position:fixed;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--c-Europe);box-shadow:inset 0 0 0 1px var(--c-Europe-d);opacity:0;pointer-events:none;z-index:2}
.intro-ring{position:fixed;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--c-Europe-d);opacity:0;pointer-events:none;transform:translate(-50%,-50%);z-index:2}

.intro-spl{position:fixed;border-radius:50%;pointer-events:none;z-index:2;opacity:0}
.intro-word .il{display:inline-block;transform-origin:50% 80%;padding:.22em .14em;margin:-.22em -.14em}

.intro-word .il.hit{animation:ilpop .75s cubic-bezier(.2,1.5,.4,1)}
@keyframes ilpop{0%{transform:translateY(-6px) scale(.94,1.08)}35%{transform:translateY(3px) scale(1.1,.9)}65%{transform:translateY(-2px) scale(.98,1.03)}100%{transform:none}}

@keyframes ilshine{40%{transform:translateY(-8px);filter:brightness(1.18) saturate(1.2) drop-shadow(0 6px 8px color-mix(in srgb,var(--a) 40%,transparent))}100%{transform:none;filter:none}}
@keyframes introRing{0%{opacity:.85;width:10px;height:10px}100%{opacity:0;width:170px;height:170px}}
.intro-skip{position:absolute;right:20px;bottom:18px;font:13px var(--sans);color:var(--ink-faint);background:none;border:0;cursor:pointer;z-index:2}
.intro-skip[hidden]{display:none}
/* while the opening plays the game waits underneath */
body.introing .app header,body.introing .app footer,body.introing .app .prompt,body.introing .app .tms{opacity:0;pointer-events:none}
body.introing:not(.introglobe) #globe{animation:none;opacity:0}
body.introing #globe{pointer-events:none}
body.introing #globe .beacon,body.introing #globe .beaconhit{opacity:0 !important}
.beacon{transition:opacity .8s}
body.introing.introglobe #globe{animation:rise 1.5s cubic-bezier(.2,.7,.2,1) both}
.app header,.app footer,.app .prompt{transition:opacity .9s ease}
.app .tms{transition:filter .2s ease,opacity .9s ease}
body.introout .app .prompt{transition-delay:.1s}
body.introout .app footer{transition-delay:.3s}
@media (prefers-reduced-motion: reduce){.intro,.intro-sub,.intro-begin{transition-duration:.01s !important}}
/* outline figure inside the Explore page */
.outline{margin:2px 0 4px;border-radius:16px;overflow:hidden;border:1px solid var(--panel-line);position:relative;
  background:radial-gradient(120% 120% at 40% 30%,var(--sea-in),var(--sea-mid) 75%,var(--sea-out));box-shadow:inset 0 0 30px rgba(60,45,20,.12)}
.outline svg{display:block;width:100%;height:auto}
.outline figcaption{position:absolute;left:12px;bottom:8px;font:italic 13px var(--serif);color:var(--ink-soft);text-shadow:0 0 6px var(--halo),0 0 12px var(--halo)}
.ol-g{fill:none;stroke:var(--grat);stroke-width:.5;vector-effect:non-scaling-stroke}
.ol-n{fill:var(--land);fill-opacity:.55;stroke:var(--border);stroke-width:.6;stroke-opacity:.7;vector-effect:non-scaling-stroke}
.ol-c{fill-opacity:.96;stroke:var(--ink);stroke-width:1.15;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 3px 5px rgba(60,45,20,.28));
  stroke-dasharray:1;stroke-dashoffset:1;animation:olDraw 2.2s .25s cubic-bezier(.3,.6,.2,1) forwards}
.ol-c.still{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
@keyframes olDraw{to{stroke-dashoffset:0}}
.seg2{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--panel-line);border-radius:99px;padding:3px}
.seg2 button{padding:0 12px;height:24px;border-radius:99px;font-size:12.5px;color:var(--ink-soft)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
[data-mode="speed"] .seg2 button[aria-pressed="true"]{background:var(--accent);color:#06142C}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden}   /* nothing may widen the page: on phones a wider page shrinks/shifts the whole view */
html{overflow:hidden;overscroll-behavior:none}
#stage{position:relative;min-height:0}
#globe{overflow:visible;position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.965)}to{opacity:1;transform:none}}
#globe.dip{animation:dip .8s ease both}
/* canvas globe (fast renderer): sits under the svg overlay (pills, labels, blooms) and mirrors the svg's animations */
#gcanvas,#glcanvas{position:absolute;left:0;top:0;pointer-events:none;display:none;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both;transition:opacity .8s ease}
body.gl #glcanvas{display:block}
#glcanvas.dip{animation:dip .8s ease both}
body.cv #gcanvas{display:block}
#gcanvas.dip{animation:dip .8s ease both}
body.cv #land,body.cv .graticule{display:none}
body.cv #globe .sphere{fill:transparent !important}
#globe.overland{cursor:var(--cur-cross)}
#globe.overland:active{cursor:grabbing}
body.introing:not(.introglobe) #gcanvas,body.introing:not(.introglobe) #glcanvas{animation:none;opacity:0}
body.introing.introglobe #gcanvas,body.introing.introglobe #glcanvas{animation:rise 1.5s cubic-bezier(.2,.7,.2,1) both}
.app.silmode #gcanvas,.app.silmode #glcanvas{opacity:0 !important}
@keyframes dip{0%{opacity:1}35%{opacity:.08}100%{opacity:1}}
#globe:active{cursor:grabbing}
#globe:focus{outline:none}
#globe:focus-visible .sphere-edge{stroke:var(--focus);stroke-width:2.5}
.country{fill:var(--land);stroke:var(--border);stroke-width:.5;vector-effect:non-scaling-stroke}
#land .country:hover{fill:color-mix(in srgb,var(--land) 92%,#8a7b5a)}
.country.missed{fill:var(--miss)}
.country[data-r="Africa"]{--p:var(--c-Africa);--pd:var(--c-Africa-d)}
.country[data-r="Americas"]{--p:var(--c-Americas);--pd:var(--c-Americas-d)}
.country[data-r="Asia"]{--p:var(--c-Asia);--pd:var(--c-Asia-d)}
.country[data-r="Europe"]{--p:var(--c-Europe);--pd:var(--c-Europe-d)}
.country[data-r="Oceania"]{--p:var(--c-Oceania);--pd:var(--c-Oceania-d)}
.wander #land .country[data-rr]:not(.found):not(.shown){transition:fill .5s ease}
.wander #land .country[data-rr="Africa"]:not(.found):not(.shown){fill:color-mix(in srgb,var(--c-Africa) 40%,var(--land))}
.wander #land .country[data-rr="Americas"]:not(.found):not(.shown){fill:color-mix(in srgb,var(--c-Americas) 40%,var(--land))}
.wander #land .country[data-rr="Asia"]:not(.found):not(.shown){fill:color-mix(in srgb,var(--c-Asia) 40%,var(--land))}
.wander #land .country[data-rr="Europe"]:not(.found):not(.shown){fill:color-mix(in srgb,var(--c-Europe) 40%,var(--land))}
.wander #land .country[data-rr="Oceania"]:not(.found):not(.shown){fill:color-mix(in srgb,var(--c-Oceania) 40%,var(--land))}
.wander #land .country[data-rr="Europe"][data-rx="Asia"]:not(.found):not(.shown){fill:color-mix(in srgb,color-mix(in srgb,var(--c-Europe),var(--c-Asia)) 40%,var(--land))}
.wander #land .country[data-rr]:not(.found):not(.shown):hover{filter:brightness(.95)}
.country.found,.country.shown,.country.bloom{fill:var(--p);stroke:var(--pd);stroke-opacity:.5;stroke-width:.8}
.country.shown{fill-opacity:.4;stroke-opacity:.25;stroke-width:.6}
.country.bloom{pointer-events:none}
.graticule{fill:none;stroke:var(--grat);stroke-width:.4}
.pulse{fill:none;pointer-events:none}
.drop{pointer-events:none}
#lift{fill:var(--lift);opacity:var(--lift-op)}
#paint{mix-blend-mode:var(--wash-blend)}
.sphere-edge{stroke:var(--edge)}
body.gl #globe:not(:focus-visible) .sphere-edge{display:none}   /* the GPU globe draws its own limb line */

/* header */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 20px 0;position:relative;z-index:3}
.brand{font-family:var(--serif);font-style:italic;font-size:24px;letter-spacing:-.01em;margin:0;font-weight:400;position:relative;white-space:nowrap}
button.brand{background:none;border:0;padding:0;color:inherit;cursor:pointer;line-height:1.1}
.hleft{display:flex;align-items:center;gap:12px;min-width:0}
.exitbtn{display:inline-flex;align-items:center;gap:4px}.exitbtn[hidden]{display:none}
.dockwrap{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.modedesc{margin:0;font:12.5px var(--sans);color:var(--ink-faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(48vw,420px);letter-spacing:.01em}
.modeName small{display:block;margin-top:12px;font:500 clamp(14px,2.2vw,22px) var(--sans);font-style:normal;letter-spacing:.01em;opacity:.9}

.mrows{padding:6px 14px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-top:1px dashed var(--panel-line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.mrow:first-child{border-top:0}
.mrow .mt{flex:1;min-width:0}.mrow .mt b{display:block;font-weight:500}.mrow .mt small{display:block;color:var(--ink-faint);font-size:12.5px;line-height:1.35}
.mrow .mgo{color:var(--ink-faint);font-size:22px;line-height:1}
.mrow:hover .mgo{color:var(--ink)}
.brand::after{content:"";position:absolute;left:0;bottom:-3px;height:5px;width:100%;max-width:92px;border-radius:50%;
  background:linear-gradient(90deg,var(--c-Europe),var(--c-Americas),var(--c-Africa),var(--c-Asia));opacity:.5;filter:blur(1.4px);transform-origin:left;animation:stroke 1.8s .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes stroke{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:.5}}
.tools{display:flex;gap:6px;align-items:center;justify-self:end}
.dock{--acc:var(--mode-acc);position:relative;display:flex;gap:2px;height:36px;padding:3px;box-sizing:border-box;border-radius:999px;background:var(--panel);border:1px solid color-mix(in srgb,var(--acc) 40%,var(--panel-line));transition:border-color .5s ease;z-index:4}
.dock button{position:relative;z-index:1;display:flex;align-items:center;gap:6px;height:28px;padding:0 13px;border-radius:999px;font:inherit;font-size:12.5px;font-weight:500;line-height:1;color:var(--ink-soft);background:none;border:0;transition:color .35s ease}

.dock button[aria-pressed="true"]{color:#fff;font-weight:600}
.dock-pill{position:absolute;left:0;top:3px;width:0;height:28px;border-radius:999px;background:var(--acc);box-shadow:0 4px 10px -5px var(--acc);transition:transform .5s cubic-bezier(.3,1.25,.4,1),width .5s cubic-bezier(.3,1.25,.4,1),background .5s ease;z-index:0}
:root{--mode-acc:#6FA27E}

.wash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;clip-path:circle(0 at 50% 50%)}
.modeName{position:fixed;left:0;right:0;top:42%;z-index:61;pointer-events:none;opacity:0;text-align:center;font-family:var(--serif);font-style:italic;font-size:clamp(54px,12vw,120px);color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.25)}
.icon-btn,.chip,.btn{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--panel-line);color:var(--ink-soft);transition:transform .25s ease}

@keyframes tsSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(.5)}100%{transform:rotate(360deg) scale(1)}}
@keyframes tsRing{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ink) 35%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.icon-btn svg{width:17px;height:17px}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* prompt */
.prompt{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:2;text-align:center;width:min(520px,calc(100% - 640px));pointer-events:none}   /* centre of the footer, floating over the foot of the globe */

.brief{position:absolute;left:50%;bottom:16px;z-index:6;width:min(380px,calc(100% - 24px));padding:14px 20px 16px;border-radius:16px;background:var(--sheet);border:1px solid var(--panel-line);box-shadow:0 18px 40px -22px var(--paper-shadow);opacity:0;transform:translate(-50%,18px);pointer-events:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}

/* the Atlas as an open book: leather cover, two pages with a spine, bookmark tabs sticking out of the top */
.sheet.book{overflow:visible;padding:0;background:transparent;border:0;box-shadow:none;max-height:none;width:min(940px,calc(100% - 24px));margin-top:34px}
.sheet.book .x{top:-30px;right:4px;background:var(--sheet);z-index:3}
.bkcover{position:relative;border-radius:14px;padding:12px 13px 14px;background-color:#6b4d33;background-image:var(--leather-img,none),linear-gradient(160deg,#7d5d3e,#5b4029);background-size:160px 160px,auto;box-shadow:0 34px 60px -30px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.08),inset 0 2px 6px rgba(255,235,200,.12),inset 0 -3px 8px rgba(0,0,0,.28)}
.bkcover::after{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(255,225,180,.3);border-radius:11px;pointer-events:none}
.bkpages{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);background-color:var(--sheet);background-image:var(--page-img,none);background-size:128px 128px;border-radius:6px;height:clamp(480px,76vh,640px);overflow:hidden;box-shadow:0 3px 0 -1px rgba(120,90,50,.28),0 6px 0 -2px rgba(120,90,50,.2),0 9px 0 -3px rgba(120,90,50,.14)}
.bkmarks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.bkpages::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:44px;transform:translateX(-50%);z-index:6;background:linear-gradient(90deg,transparent,rgba(60,40,20,.14) 44%,rgba(60,40,20,.3) 50%,rgba(60,40,20,.14) 56%,transparent);pointer-events:none;z-index:2}
.bkpage{padding:22px 30px 24px;overflow:auto;height:100%;box-sizing:border-box;min-width:0;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--panel-line) transparent}
.bkpage.l{padding-right:38px}.bkpage.r{padding-left:38px}
.bk-tabs{position:absolute;left:28px;top:-31px;display:flex;gap:6px;z-index:3}
.bk-tab{height:35px;padding:0 17px;border-radius:10px 10px 0 0;border:0;font:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--tabc);cursor:pointer;opacity:.8;transform:translateY(5px);box-shadow:inset 0 -10px 10px -10px rgba(0,0,0,.35);transition:transform .25s ease,opacity .25s ease}
.bk-tab{background-image:repeating-linear-gradient(37deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),repeating-linear-gradient(-53deg,rgba(0,0,0,.09) 0 1px,transparent 1px 4px),radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 60%);position:relative;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.bk-tab::before{content:"";position:absolute;inset:3px 3px 0;border:1.2px dashed rgba(255,255,255,.45);border-bottom:0;border-radius:7px 7px 0 0;pointer-events:none}
.bk-tab::after{content:"";position:absolute;left:0;right:0;top:0;height:35%;border-radius:10px 10px 0 0;background:linear-gradient(rgba(255,255,255,.2),transparent);pointer-events:none}

/* the bookmarks stick out of the top of the book, at the right-hand corner, and are always there */

}
.adet{border-top:1px dashed var(--panel-line);padding:9px 0}

/* speed HUD */

/* floating labels: written in like ink */

  opacity:0;clip-path:inset(0 100% 0 0);filter:blur(2px);transition:opacity .5s ease,clip-path .75s cubic-bezier(.3,.7,.2,1),filter .6s ease}

/* fact card: unfolds like a paper slip; "Explore" widens it into a reading page */
.card{position:absolute;z-index:7;right:12px;bottom:10px;width:min(340px,calc(100% - 24px));max-height:calc(100% - 20px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--panel-line);

  transform-origin:100% 100%;transform:translateY(22px) rotate(1.6deg) scale(.96);opacity:0;pointer-events:none;
  transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1),width .55s cubic-bezier(.2,.8,.2,1)}

.jrbtn{display:inline-flex;align-items:center;gap:7px;margin:-4px 0 10px;padding:0;border:0;background:none;font:inherit;font-size:11.5px;letter-spacing:.03em;color:var(--ink-faint);cursor:pointer}

.rdwin{position:fixed;z-index:46;top:64px;right:16px;width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 92px);display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--panel-line);border-radius:18px;box-shadow:0 24px 60px -20px var(--paper-shadow),0 0 0 1px rgba(0,0,0,.04)}

.exrev{margin:8px 0 4px;display:grid;gap:6px}.exr{margin:0;padding:8px 12px;border-radius:12px;background:var(--panel);font-size:13.5px;color:var(--ink-soft);border:1px solid var(--panel-line)}.exr.ok{opacity:.75}.exr b{color:var(--ink);font-weight:500}

.mwhy{margin:12px 0 0;font-size:13.5px;color:var(--ink-soft);line-height:1.45}

.cbpages{perspective:1800px}

.bkctl .grow{flex:1}.bkctl .chip{background:rgba(255,240,215,.14);border-color:rgba(255,225,180,.35);color:#f3e3c3}
.bkctl .cbind{color:#e9d6b0;font:12.5px var(--sans);min-width:54px;text-align:center}

.cbleft{position:absolute;left:0;top:0;width:50%;height:100%;background-color:#6b4d33;background-image:var(--leather-img,none),linear-gradient(160deg,#7d5d3e,#5b4029);background-size:160px 160px,auto}

@media (max-width:719px){.cbfront{animation:none;opacity:0}.cbleft{display:none}.cbstage{animation-duration:.6s}}
.bkpage .cbwrap{display:flex;flex-direction:column;height:100%;margin-top:0}
.bkpage.l:has(.cbwrap){overflow:hidden}
.cbstats{font:12px var(--sans);color:var(--ink-soft);margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbfacts{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;margin:0 0 4px;font-size:12.5px;font-family:var(--serif)}
.cbfacts span{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--panel-line);padding-bottom:2px;min-width:0}

.cbfacts i{font:normal 11.5px var(--sans);color:var(--ink-faint);letter-spacing:.03em;flex:none}
.cbhead{display:flex;align-items:center;gap:12px;margin:0 0 8px}
.cbhead img{width:48px;max-height:34px;object-fit:contain;border-radius:3px;box-shadow:0 0 0 1px rgba(58,51,43,.18);flex:none}
.cbid h2{margin:0;font-size:23px;line-height:1.1;font-family:var(--serif);font-weight:500}.cbid small{color:var(--ink-faint);font-size:12.5px;letter-spacing:.04em}
.cbkv{margin:0 0 6px;font-size:13px}.cbkv dd{font-size:12.5px}
.cbtree{width:100%;flex:1 1 0;min-height:0;margin-top:2px;overflow:hidden}
.cbtree>.mtree{width:100%;height:100%;max-width:none;margin:0 auto;display:block}
.rf .rfhalf{position:absolute;top:0;width:50%;height:100%;overflow:hidden;background-color:var(--sheet);background-image:var(--page-img,none);background-size:128px 128px}

.cbstage.rf{animation:rfFade 1.55s linear forwards}

.mhead{display:flex;align-items:center;gap:14px;margin:0 0 6px}

.mrow .mt{flex:1;min-width:0;font-family:var(--serif);font-size:16px}
.mrow .mt small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink-faint)}
.mq{font-family:var(--serif);font-size:18px;line-height:1.45;margin:6px 0 14px}

.mtile.l0{opacity:.45}.mtile.l2{border-color:#B8B2A6}.mtile.l3{border-color:#C9A24B}.mtile.l3 .mlv{color:#C9A24B}.card .tname{min-width:0}

.fbflag{width:48px;max-height:34px;object-fit:contain;border-radius:3px;box-shadow:0 0 0 1px rgba(58,51,43,.18)}
.fbflag.e{font-size:30px;line-height:1;box-shadow:none}
.fbname{display:flex;align-items:center;gap:8px;font:500 19px var(--serif);line-height:1.15}
.fbname .chk{width:20px;height:20px;flex:none;border-radius:50%;background:var(--mode-acc);display:grid;place-items:center}
.fbname .chk svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26}
.fbcard.in .chk svg{animation:fbDraw .5s .15s ease forwards}
@keyframes fbDraw{to{stroke-dashoffset:0}}
.fbcard.miss .chk{background:var(--hot)}
.fbcap{display:block;font-size:14px;color:var(--ink);margin-top:2px}
.fbwhere{display:block;font-size:12px;color:var(--ink-faint)}
.fbline{grid-column:1/-1;border-top:1px dashed var(--panel-line);padding-top:6px;font:500 13px var(--sans);color:var(--ink-soft)}
.fbline.up{color:var(--mode-acc)}
@media (prefers-reduced-motion: reduce){.fbcard.in{transition:none}.fbcard.in .chk svg{animation:none;stroke-dashoffset:0}}
.hintshape{display:block;margin:6px auto 2px;width:130px;height:83px}
.hintshape[hidden]{display:none}
.hintshape path{fill:color-mix(in srgb,var(--ink) 12%,transparent);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.pips{display:inline-flex;gap:3px;margin-right:7px;vertical-align:middle}
.pips i{width:5px;height:5px;border-radius:50%;background:var(--ink-faint);opacity:.4;display:block}
.pips i.on{background:var(--mode-acc);opacity:1}
.endbtn[hidden]{display:none}
.toast{position:fixed;right:16px;top:58px;z-index:60;transform:translate(0,-190px);background:var(--sheet);border:1px solid var(--panel-line);border-radius:14px;padding:10px 16px;
  box-shadow:0 14px 30px -14px var(--paper-shadow);transition:transform .7s cubic-bezier(.2,.9,.2,1);display:flex;gap:10px;align-items:center;max-width:min(380px,calc(100% - 28px))}
.toast.on{transform:translate(0,0)}
.toast .ic{font-size:22px}

@media (max-width:720px){
  header{padding:10px 12px 0;gap:8px}
  .brand{font-size:20px}
  .brand::after{display:none}
  .dock button span{display:none}
  .dock button[aria-pressed="true"] span{display:inline}
  .dock button{padding:0 9px;gap:5px}
  .dock button[aria-pressed="true"]{padding:0 11px}
  .icon-btn{width:32px;height:32px}
  .tools{gap:4px}
  .prompt .hint{font-size:13.5px}
  footer{padding:0 14px 12px;gap:8px;flex-direction:column;align-items:stretch}
  .progress,.bar{width:100%}
  .chips{margin:0 -14px;padding:2px 14px}
  .card h2{font-size:22px}
  .card .where{margin-bottom:8px}
  .card .note{margin-top:8px;font-size:14px}
  .card .flagimg{width:48px}
  .card,.card.big{left:10px;right:10px;width:auto;bottom:8px;padding:12px 14px 0;max-height:min(82%,640px)}
  .card .cardmore{display:grid}
  .card:not(.peek) .cardmore svg{transform:rotate(180deg)}
  .card:not(.peek) .top{padding-right:64px}
  .card.peek{padding:10px 12px;border-radius:14px;cursor:pointer}
  .card.peek .cardbody,.card.peek .where,.card.peek .jrbtn{display:none}
  .card.peek .tsub{display:block}
  .card.peek .top{gap:10px;padding-right:68px}
  .card.peek h2{font-size:18px}
  .card.peek .flagimg{width:40px}
  .card.peek .close,.card.peek .cardmore{top:50%;margin-top:-14px}
  .card dl{font-size:13px}
  .sheet{padding:20px 18px}
  .sheet h2{font-size:26px}
}
/* ---- phones (Safari/iOS): additive rules only; desktop rules above are untouched ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation}
@supports (height:100dvh){.sheet{max-height:min(88dvh,740px,calc(100dvh - var(--kb,0px) - 16px))}}
@media (max-width:720px){
  .sil{place-items:start center;padding-top:24px}
  #silSvg{max-height:30vh}
  .soundchip{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:900px){.modedesc{max-width:40vw}}
@media (pointer:coarse) and (max-width:1100px){
  .icon-btn{width:40px;height:40px}
  .chip{min-height:32px}
  .btn{min-height:40px}
  .seg2 button{min-height:28px}
}
@media (max-width:480px){
  header{grid-template-columns:auto 1fr}
  .hleft,.modedesc{display:none}
  .closebtn{padding:0 !important;width:34px !important;justify-content:center}.closebtn span{display:none}
  .icon-btn{width:36px;height:36px}
}
@media (max-height:480px){   /* phones held sideways (short windows) */
  .sil{padding:56px 12px 6px;place-items:start center}
  .silcard{max-height:100%;overflow:auto;padding:8px 14px 10px}
  #silSvg{max-height:24vh}
  .silq{font-size:18px;margin:2px 0}
  .silhint{min-height:0;margin-bottom:4px}
}
/* lite graphics (phones by default): no paper layers, no blur, flat fills, cheaper strokes */
body.lite #globe .country,body.lite #globe .graticule,body.lite #globe .sphere-edge{vector-effect:none}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .label{clip-path:none}
  .count.beat{opacity:1}
}
/* native controls and scrollbars follow the theme */
:root{color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"],[data-mode="speed"]{color-scheme:dark}
/* tall panels follow the visible screen height on phones whose toolbars move */
@supports (height:100dvh){
  .rdwin{max-height:calc(100dvh - 92px)}
  .sil.hot .hotlist{max-height:48dvh}
}
/* touch: a few small controls get a comfortable target */
@media (pointer:coarse){
  .seg2 button,.silsug li button,.chip{min-height:34px}
}
</style>
</head>
<body class="introing">
<div class="speedbg" aria-hidden="true"></div>
<canvas class="bench" id="bench" aria-hidden="true"></canvas>
<div class="intro" id="intro" role="dialog" aria-label="Welcome to Mapbloom">

  </div>
  <i class="intro-drop" id="introDrop"></i><i class="intro-ring" id="introRing"></i>

</div>
<div class="app" id="app">
  <header>

    <div class="dockwrap">
    <div class="dock" id="dock" role="group" aria-label="Mode">
        <i class="dock-pill" id="dockPill"></i>
        <button id="modeWander" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Explore</span></button>
        <button id="modeFind" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span>Quiz</span></button>
        <button id="modeSpeed" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 3h5M18.5 6l1.2-1.2"/></svg><span>Race</span></button>
        <button id="modeHot" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14.5V5a2 2 0 014 0v9.5a4 4 0 11-4 0z"/><path d="M12 9v7"/></svg><span>Hot &amp; cold</span></button>
    </div>
    <p class="modedesc" id="modeDesc" aria-live="polite">Discover the world at your own pace.</p>
    </div>
    <div class="tools">
      <button class="icon-btn" id="stampBtn" aria-label="Journal" title="Journal: atlas, stamps, expeditions and mastery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
      </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path class="moon" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><g class="sun" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Menu" title="Menu: home, journal, settings, about">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

  </header>

  <div id="stage">
    <canvas id="glcanvas" aria-hidden="true"></canvas>
    <canvas id="gcanvas" aria-hidden="true"></canvas>

    <div id="labels"></div>

    <div class="sil" id="sil" hidden>
      <div class="silcard">
        <svg id="silSvg" viewBox="0 0 360 230" role="img" aria-label="The shape of a country"></svg>

      </div>
    </div>

    <button class="tms" id="tmsBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Take me somewhere</span></button>

      <dl class="bfacts" id="briefFacts"></dl>
      <div class="brow"><button class="btn primary" id="briefGo" type="button" disabled>Explore</button><button class="chip" id="briefAgain" type="button">Somewhere else</button></div>
    </aside>
    <aside class="card" id="card" aria-live="polite">
      <button class="cardmore icon-btn" id="cardMore" aria-label="Show details" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>

        <div class="sp-clock"><span class="sp-time" id="sTime">0:00.0</span><span class="sp-pen" id="sPen"></span></div>

        <h2 class="target" id="sTarget"></h2>
