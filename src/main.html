const US_RAW="Alabama:AL:Montgomery;Alaska:AK:Juneau;Arizona:AZ:Phoenix;Arkansas:AR:Little Rock;California:CA:Sacramento;Colorado:CO:Denver;Connecticut:CT:Hartford;Delaware:DE:Dover;Florida:FL:Tallahassee;Georgia:GA:Atlanta;Hawaii:HI:Honolulu;Idaho:ID:Boise;Illinois:IL:Springfield;Indiana:IN:Indianapolis;Iowa:IA:Des Moines;Kansas:KS:Topeka;Kentucky:KY:Frankfort;Louisiana:LA:Baton Rouge;Maine:ME:Augusta;Maryland:MD:Annapolis;Massachusetts:MA:Boston;Michigan:MI:Lansing;Minnesota:MN:Saint Paul;Mississippi:MS:Jackson;Missouri:MO:Jefferson City;Montana:MT:Helena;Nebraska:NE:Lincoln;Nevada:NV:Carson City;New Hampshire:NH:Concord;New Jersey:NJ:Trenton;New Mexico:NM:Santa Fe;New York:NY:Albany;North Carolina:NC:Raleigh;North Dakota:ND:Bismarck;Ohio:OH:Columbus;Oklahoma:OK:Oklahoma City;Oregon:OR:Salem;Pennsylvania:PA:Harrisburg;Rhode Island:RI:Providence;South Carolina:SC:Columbia;South Dakota:SD:Pierre;Tennessee:TN:Nashville;Texas:TX:Austin;Utah:UT:Salt Lake City;Vermont:VT:Montpelier;Virginia:VA:Richmond;Washington:WA:Olympia;West Virginia:WV:Charleston;Wisconsin:WI:Madison;Wyoming:WY:Cheyenne";
/* the word for what is being found: states when the map is the United States, countries everywhere else */
const isUS=()=>S.region==="United States";
const unitW=(n,cap)=>{const w=isUS()?(n===1?"state":"states"):(n===1?"country":"countries");return cap?w.charAt(0).toUpperCase()+w.slice(1):w};
const US={on:false,data:null,names:[],cap:{},abbr:{},round:null,target:null,painted:new Set(),hl:null,svg:null,loading:null,style:"country"};
US_RAW.split(";").forEach(x=>{const p=x.split(":");US.names.push(p[0]);US.abbr[p[0]]=p[1];US.cap[p[0]]=p[2]});
function usLoad(){
  if(US.data)return Promise.resolve();
  if(!US.loading)US.loading=fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(r=>r.json()).then(t=>{
    const fs=topojson.feature(t,t.objects.states).features.filter(f=>US.names.includes(f.properties.name));
    if(fs.length<50)throw new Error("states missing");
    US.data=fs;usColorsBuild();
  }).catch(e=>{US.loading=null;toast("\u{1F5FA}️","Could not load the state map","The states need an internet connection the first time.",4000);throw e});
  return US.loading;
}
function usEnter(first){
  if(!US.data)return;
  if(!US.svg){US.svg=d3.select("#stage").append("svg").attr("class","usmap").attr("aria-label","Map of the United States");US.g=US.svg.append("g");usZoomInit()}
  usZoomReset();US.on=true;US.painted=new Set();US.hl=null;$("app").classList.add("usmode");
  US.g.selectAll("path").data(US.data,d=>d.properties.name).join("path").attr("data-n",d=>d.properties.name).on("click",(e,d)=>usClick(d.properties.name));
  usLayout();usPaint();
}
/* zoom and pan the state map: wheel, pinch or drag, or the + / - / reset buttons; the strokes stay thin as you zoom */
function usZoomInit(){
  US.zoom=d3.zoom().scaleExtent([1,10]).clickDistance(5).filter(e=>(!e.ctrlKey||e.type==="wheel")&&!e.button).on("zoom",e=>{US.g.attr("transform",e.transform)});
  US.svg.call(US.zoom).on("dblclick.zoom",null);
  const box=document.createElement("div");box.className="uszoom";box.setAttribute("role","group");box.setAttribute("aria-label","Zoom the map");
  const mk=(t,label,fn)=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.title=label;b.setAttribute("aria-label",label);b.onclick=e=>{e.stopPropagation();sndTick();fn()};box.append(b)};
  mk("+","Zoom in",()=>US.svg.transition().duration(250).call(US.zoom.scaleBy,1.6));
  mk("\u2212","Zoom out",()=>US.svg.transition().duration(250).call(US.zoom.scaleBy,1/1.6));
  mk("\u2302","Whole map",()=>US.svg.transition().duration(300).call(US.zoom.transform,d3.zoomIdentity));
  $("stage").append(box);
}
function usZoomReset(){if(US.svg&&US.zoom)US.svg.call(US.zoom.transform,d3.zoomIdentity)}
function usLayout(){
  if(!US.svg||!US.data)return;
  const phone=W<900,top=phone?150:70,bot=phone?150:W<1100?170:150;
  const proj=d3.geoAlbersUsa().fitExtent([[12,top],[W-12,Math.max(top+80,H-bot)]],{type:"FeatureCollection",features:US.data}),path=d3.geoPath(proj);
  US.svg.attr("viewBox",`0 0 ${W} ${H}`).style("width",W+"px").style("height",H+"px");if(US.zoom)US.zoom.extent([[0,0],[W,H]]).translateExtent([[0,0],[W,H]]);
  US.g.selectAll("path").attr("d",path);
}
/* the states paint in red, white and blue, with no two neighbours alike (a greedy colouring over the shared borders; a fourth, softer blue only where three will not do) */
const US_RWB=["#D2343F","#FAF6EC","#2F55A4","#7F9BD6"];
function usColorsBuild(){
  const vk=new Map();US.data.forEach(f=>{const n=f.properties.name,polys=f.geometry.type==="MultiPolygon"?f.geometry.coordinates:[f.geometry.coordinates];polys.forEach(p=>p.forEach(r=>r.forEach(q=>{const k=q[0].toFixed(3)+","+q[1].toFixed(3);let s=vk.get(k);if(!s){s=new Set();vk.set(k,s)}s.add(n)})))});
  const nb={};US.names.forEach(n=>nb[n]=new Map());
  vk.forEach(s=>{if(s.size>1){const a=[...s];a.forEach(x=>a.forEach(y=>{if(x!==y)nb[x].set(y,(nb[x].get(y)||0)+1)}))}});
  const col={},todo=new Set(US.names),usedOf=n=>{const u=new Set();nb[n].forEach((c,o)=>{if(c>1&&col[o]!==undefined)u.add(col[o])});return u};
  while(todo.size){   // DSATUR: always colour the most constrained state next, so the softer fourth colour is rarely needed
    let best=null,bs=-1,bd=-1;todo.forEach(n=>{const s=usedOf(n).size,d=nb[n].size;if(s>bs||(s===bs&&d>bd)){best=n;bs=s;bd=d}});
    const u=usedOf(best);let k=0;while(u.has(k)&&k<3)k++;col[best]=k;todo.delete(best);
  }
  US.col=col;
}
function usColor(n){const k=US.col&&US.col[n];return US_RWB[k===undefined?1:k]}
function usPaint(){if(!US.g)return;US.g.selectAll("path").style("fill",d=>US.painted.has(d.properties.name)?usColor(d.properties.name):null)}
function usHl(){if(!US.g)return;US.g.selectAll("path").classed("hl",d=>d.properties.name===US.hl)}
function usStop(){if(!US.on&&!US.svg)return;US.on=false;US.round=null;US.target=null;US.hl=null;$("app").classList.remove("usmode");if(US.g)usHl();usZoomReset()}
function usFlash(n,cls){if(!US.g)return;const p=US.g.selectAll("path").filter(d=>d.properties.name===n);p.classed(cls,true);setTimeout(()=>p.classed(cls,false),600)}
const usNorm=s=>silNorm(String(s));
function usCheck(name,txt){
  const t=usNorm(txt);if(!t)return false;const n=usNorm(name);
  if(t===n||t===usNorm(US.abbr[name]))return true;
  if(US.names.some(o=>usNorm(o)===t)||US.names.some(o=>usNorm(US.abbr[o])===t))return false;   // another real state: never forgiven
  return n.length>=6&&Math.abs(n.length-t.length)<=1&&lev(t,n)<=1;
}
function usClick(n){
  if(!US.on)return;
  if(S.mode==="speed"){if(R.phase==="run"&&R.cur&&R.variant!=="name")usRaceTry(n);return}
  if(S.mode==="find"&&US.target&&!S.done&&US.style!=="name")usQuizTry(n);
}
/* ---- Quiz: a round of states ---- */
function usQuizBegin(){
  closeModal();D.active=false;S.qIdle=false;S.practice=false;endSession();
  US.style=["country","capital","name"].includes(S.quiz)?S.quiz:"country";
  usLoad().then(()=>{
    usEnter(true);
    US.round={n:S.rlen?Math.min(S.rlen,50):50,done:0,first:0,miss:[],ids:new Set(),t0:performance.now()};
    stopDrift();updateProgress();usNext();
  }).catch(()=>{S.region="World";syncChips();quizIdle()});
}
function usNext(){
  clearAuto();hideCard();silHide();
  const r=US.round;if(!r)return;
  if(r.done>=r.n){usRoundResult();return}
  const left=US.names.filter(n=>!r.ids.has(n)),w=left.map(n=>(S.weak["us:"+n]>0?3:1));
  let t=Math.random()*d3.sum(w),pick=left[left.length-1];for(let i=0;i<left.length;i++){t-=w[i];if(t<=0){pick=left[i];break}}
  US.target=pick;S.done=false;S.tries=0;S.target=null;
  $("qFlag").hidden=true;const tg=$("target");tg.classList.toggle("small",US.style==="capital");
  if(US.style==="name"){$("ask").textContent="";swell(tg,"");$("showBtn").hidden=true;usNameBegin(pick,false)}
  else if(US.style==="capital"){$("ask").textContent="Find the state whose capital is";swell(tg,US.cap[pick]);$("showBtn").hidden=false;syncHintBtn()}
  else{$("ask").textContent="";swell(tg,pick);$("showBtn").hidden=false;syncHintBtn()}
  swell($("hint"),"");$("nextBtn").hidden=true;
}
function usQuizTry(n){
  if(n===US.target)return usSuccess(false);
  S.tries++;S.streak=0;const T="us:"+US.target;S.weak[T]=Math.min(10,(S.weak[T]||0)+2);save();sndMiss();usFlash(n,"miss");
  swell($("hint"),`That is ${n}. Not quite.`);
}
function usSuccess(shown){
  const r=US.round,T=US.target;if(!r||!T||S.done)return;S.done=true;
  r.ids.add(T);r.done++;
  if(shown){r.miss.push(T);S.weak["us:"+T]=Math.min(10,(S.weak["us:"+T]||0)+3);sndShow();usFlash(T,"reveal")}
  else{const first=S.tries===0;if(first){r.first++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak)}US.painted.add(T);usPaint();sndHit("Americas",first)}
  silHide();updateProgress();save();
  swell($("hint"),shown?`That is ${T}.`:(S.tries===0?"Exactly right. First try.":"Found it."));
  if(US.style!=="country"){$("ask").textContent="That is";swell($("target"),T);$("target").classList.remove("small")}
  $("showBtn").hidden=true;$("nextBtn").hidden=false;$("nextBtn").textContent=r.done>=r.n?"See results":"Next place";
  armAutoNext();
}
function usRoundResult(){
  silHide();clearAuto();const r=US.round,sh=$("sheet");sh.innerHTML="";
  const ms=performance.now()-r.t0,pct=r.n?Math.round(r.first/r.n*100):0;
  sh.append(closeBtn(),el("div",{class:"hero"},el("p",{class:"sub"},`Round complete \xB7 ${r.n} states`),el("div",{class:"bignum"},`${r.first}/${r.n}`),el("span",{class:"delta"+(pct>=80?" up":"")},`${pct}% on the first try`)));
  const stat=(k,v)=>el("div",{class:"stat"},el("b",{},v),el("small",{},k));
  sh.append(el("div",{class:"stats",style:"grid-template-columns:repeat(3,1fr)"},stat("Time",fmtT(ms)),stat("Revealed",String(r.miss.length)),stat("Best streak",String(S.bestStreak||0))));
  if(r.miss.length)sh.append(el("h3",{},"Worth another look"),el("div",{class:"nchips"},r.miss.map(n=>el("span",{},n+" - "+US.cap[n]))));
  sh.append(el("div",{class:"sheetfoot"},el("button",{class:"btn",onclick:()=>setMode("wander")},"Back to Explore"),el("button",{class:"btn",onclick:()=>{sndTick();quizIdle()}},"Change settings"),el("span",{class:"grow"}),el("button",{class:"btn primary",onclick:()=>{sndTick();usQuizBegin()}},"Another round")));
  sndFlourish("Americas");openModal();
}
/* ---- typed answers (Name it) ---- */
function usNameBegin(n,race){
  silKeep();nmOn=false;US.hl=n;usHl();hideCard();
  const box=$("sil");box.hidden=false;box.classList.remove("out");box.classList.add("nameit");$("silSvg").style.display="none";$("app").classList.add("nameit");
  $("silQ").textContent="Which state is glowing?";$("silIn").value="";$("silSug").innerHTML="";$("silHint").textContent="";
  $("silShow").textContent=race?"Skip \xB7 +10s":"Reveal";$("silSkip").hidden=!!race;
  setTimeout(()=>{try{$("silIn").focus({preventScroll:true})}catch(e){}},80);
}
function usNameGuess(){
  const txt=$("silIn").value;if(!txt.trim())return;
  const race=S.mode==="speed",T=race?(R.cur||"").replace("us:",""):US.target;if(!T)return;
  if(usCheck(T,txt)){if(race){$("silIn").value="";usRaceHit(T)}else usSuccess(false);return}
  const fm=$("silForm");fm.classList.remove("shake");void fm.offsetWidth;fm.classList.add("shake");
  if(race){racePen("Not \""+txt.trim()+"\". +2s");$("silIn").select();return}
  S.tries++;S.streak=0;S.weak["us:"+T]=Math.min(10,(S.weak["us:"+T]||0)+2);save();sndMiss();
  $("silHint").textContent=S.hints?`Not quite. It starts with ${T[0]}.`:"Not quite.";$("silIn").select();
}
$("silIn").addEventListener("input",()=>{
  if(!US.on)return;const t=usNorm($("silIn").value),ul=$("silSug");ul.innerHTML="";
  if(t.length<2)return;
  US.names.filter(n=>usNorm(n).includes(t)).sort((x,y)=>(usNorm(y).startsWith(t)?1:0)-(usNorm(x).startsWith(t)?1:0)).slice(0,5).forEach(n=>ul.append(el("li",{},el("button",{type:"button",onclick:()=>{$("silIn").value=n;ul.innerHTML="";$("silIn").focus()}},n))));
},true);
/* ---- Race: all 50 states against the clock ---- */
function usRaceNext(){
  R.cur=R.queue[0];R.tTarget=performance.now();const n=R.cur.replace("us:",""),v=R.variant||"country";
  $("sFlag").hidden=true;$("sTarget").classList.toggle("small",v==="capital");
  if(v==="capital"){$("sAsk").textContent="Find the state whose capital is";swell($("sTarget"),US.cap[n])}
  else if(v==="name"){$("sAsk").textContent="";swell($("sTarget"),"");usNameBegin(n,true)}
  else{$("sAsk").textContent="";swell($("sTarget"),n)}
  $("sCount").textContent=`${R.found.size} / ${R.total}`;
}
function usRaceTry(n){
  if(n===R.cur.replace("us:",""))return usRaceHit(n);
  racePen(`Not ${n}. +2s`);usFlash(n,"miss");
}
function usRaceHit(n){
  const T="us:"+n;R.times[T]=performance.now()-R.tTarget;R.found.add(T);R.queue.shift();R.streak++;R.cur=null;
  if(S.weak[T]&&R.times[T]<4000)S.weak[T]=Math.max(0,S.weak[T]-1);
  US.painted.add(n);usPaint();usHl();sndSpeedHit();musUpdate();updateProgress();
  swell($("sHint"),"");$("sCount").textContent=`${R.found.size} / ${R.total}`;
  if(R.found.size>=R.total)finishRace();else setTimeout(speedNext,320);
}

/* ---------- camera memory: where you last left the globe ---------- */
let viewTm=null;
function saveViewSoon(){clearTimeout(viewTm);viewTm=setTimeout(save,400)}
function restoreView(){
  const v=S.view;if(!v||!Array.isArray(v.r))return;
  const fin=x=>Number.isFinite(+x)?+x:0;projection.rotate([fin(v.r[0]),clamp(fin(v.r[1]),-85,85),fin(v.r[2])]);
  zoomK=clamp(Number.isFinite(+v.k)?+v.k:1,.8,8);
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});window.addEventListener("pagehide",save);
window.addEventListener("storage",e=>{if(e.key!==KEY||!e.newValue||WIPED)return;try{const o=JSON.parse(e.newValue);let n=0;(Array.isArray(o.found)?o.found:[]).forEach(id=>{if(FACTS[id]&&!S.found.has(id)){S.found.add(id);n++}});if(n){paint();updateProgress()}}catch(x){}});

/* ---------- go ---------- */
window.addEventListener("resize",size);
document.documentElement.dataset.mode="wander";document.getElementById("app").classList.add("wander");
applyFx();document.body.classList.toggle("cv",CANVAS);nbApplied=nbNow();document.body.classList.toggle("nb",nbApplied);cvColors();{const v=REGION_VIEW.World;projection.rotate([-v[0],-v[1],0]);zoomK=1}size();paint();updateProgress();placeDock();syncModeDesc(S.mode);document.fonts&&document.fonts.ready&&document.fonts.ready.then(placeDock);window.addEventListener("resize",placeDock);
if(window.ResizeObserver)new ResizeObserver(placeDock).observe($("dock"));
if(window.visualViewport)visualViewport.addEventListener("resize",placeDock);

setTimeout(buildMid,700);
checkExp(true);
  initIntro();
syncZoom();
if(!reduced){drifting=false;scheduleDrift();}
})();
